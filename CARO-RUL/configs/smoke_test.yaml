schema_version: 1
run_id: SMOKE_SYNTHETIC
dataset:
  root: examples/synthetic_dataset
  records: [SW1, SW2, SW3]
  feature_columns: [peak_voltage_v, voltage_min_v, voltage_peak_to_peak_v,
                    voltage_mean_v, voltage_std_v, voltage_rms_v,
                    baseline_mean_v, baseline_std_v,
                    baseline_corrected_peak_v, baseline_corrected_trough_v,
                    peak_time_s, rise_time_10_90_s, fwhm_s,
                    positive_pulse_area_v_s]
protocol:
  split: leave_one_device_out_before_windowing
  target: rul_observed_events
  window: 32
  train_fraction: [0.05, 0.65]
  validation_fraction: [0.66, 0.80]
  train_samples_per_source: 8
  validation_samples_per_source: 4
  test_checkpoints: [0.20, 0.50, 0.80]
  fixed_event_indices: [32, 64]
  preprocessing_fit_max_fraction: 0.65
  input_channels: values_plus_first_differences_plus_missing_masks_plus_causal_age
  primary_metric: device_macro_nmae
  secondary_metrics: [device_macro_nrmse, device_macro_r2,
                      normalized_bias, overestimation_rate]
training:
  screening_seeds: [17]
  confirmation_seeds: [17]
  epochs: 1
  patience: 1
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  hidden_size: 8
  hazard_bins: 16
  gradient_clip: 1.0
models:
  classical: []
  standard_neural: []
  domain_generalization: []
  modern: []
  proposed: [caro_rul]
runtime:
  device: cpu
  resume: false
  output: results/smoke_test
